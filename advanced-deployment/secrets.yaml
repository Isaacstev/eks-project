apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: eks-project
type: Opaque
data:
  # These are base64 encoded values
  # In production, these would be managed by AWS Secrets Manager or similar
  database-url: bW9uZ29kYjovL21vbmdvLXNlcnZpY2U6MjcwMTcvYXBwZGI=  # mongodb://mongo-service:27017/appdb
  api-key: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo=  # abcdefghijklmnopqrstuvwxyz
  redis-password: cmVkaXNwYXNzd29yZA==  # redispassword
stringData:
  # These values are automatically base64 encoded by Kubernetes
  jwt-secret: "my-super-secret-jwt-key"
  encryption-key: "my-encryption-key-for-sensitive-data"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: eks-project
data:
  app-mode: "production"
  log-level: "info"
  max-connections: "100"
  timeout: "30"
  feature-flags: |
    {
      "new-ui": true,
      "advanced-analytics": false,
      "beta-features": false
    }
